name: PR Lint

# squash merge 시 PR 제목이 그대로 커밋 메시지가 되므로 Conventional Commits 형식을 강제한다.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            release
          requireScope: false

  # main 으로는 dev(최종본)와 hotfix/* 브랜치에서 온 PR 만 허용한다.
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ] && [[ "$HEAD" != hotfix/* ]]; then
            echo "::error::main 으로는 dev 또는 hotfix/* 브랜치만 PR 할 수 있습니다. base 를 dev 로 바꿔주세요. (현재: $HEAD → $BASE)"
            exit 1
          fi
          echo "OK: $HEAD → $BASE"
