name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRD: Windows 11 1차 지원. macOS 지원 시점에 macos-latest 추가
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # 스크립트가 없거나 실패하면 CI가 실패한다(--if-present로 건너뛰지 않는다).
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # 브랜치 보호 규칙에는 이 job 하나만 필수 체크로 등록하면 된다.
  # job을 추가하면(예: 서버 Java 테스트) needs와 아래 결과 검사에도 넣는다. 빠지면 그 job이 실패해도 자동 머지된다.
  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [build-test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "build-test: ${{ needs.build-test.result }}"
            exit 1
          fi
