name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRD: Windows 11 1차 지원, macOS 후속 → Windows가 필수, macOS는 호환성 확인용
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json 이 아직 없어 빌드/테스트를 건너뜁니다."
          fi

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.has_pkg == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm run typecheck --if-present

      - name: Test
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm run build --if-present

  # 브랜치 보호 규칙에는 이 job 하나만 필수 체크로 등록하면 된다.
  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [build-test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "build-test: ${{ needs.build-test.result }}"
            exit 1
          fi
